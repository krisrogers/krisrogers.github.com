<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#74c2e4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pop the Sky</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* what the artifact viewer supplied, now ours: page reset, the hidden attribute, the bundled font */
html { overflow: hidden; }
body { margin: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
@font-face { font-family: 'Baloo 2'; font-weight: 600; font-display: swap; src: url(baloo2-600.woff2) format('woff2'); }
@font-face { font-family: 'Baloo 2'; font-weight: 800; font-display: swap; src: url(baloo2-800.woff2) format('woff2'); }

/* Layout: one full-bleed canvas scene; score, hearts, progress card and start card float above it as DOM. */
:root {
  --sky-low: #d2f0fc;
  --ink: #17324a;
  --paper: #fffaf0;
  --pop: #e4523c;
  --sun: #f0a637;
  --leaf: #4dab69;
  --font-display: 'Baloo 2', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky-low);
  color: var(--ink);
  font-family: var(--font-display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud {
  position: relative; z-index: 1; pointer-events: none;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font-weight: 800; font-size: 2rem; line-height: 1;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 var(--paper);
}
#hearts { color: var(--pop); letter-spacing: 2px; }
#round { font-size: 1.25rem; }
#status {
  position: relative; z-index: 1; pointer-events: none;
  text-align: center; font-weight: 800; font-size: 1.25rem; min-height: 1.5em;
  text-shadow: 0 2px 0 var(--paper);
}
body.night .hud, body.night #status { color: var(--paper); text-shadow: 0 2px 0 var(--ink); }
body.night #hearts { color: #ff8a7d; }

.overlay {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
}
#trail { z-index: 1; pointer-events: none; }
#trail.wait { pointer-events: auto; }
#hearts { display: inline-block; }
#hearts.shake { animation: shake .45s; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.icon-btn { padding: 8px 40px; line-height: 0; }
.icon-btn svg { width: 44px; height: 44px; }
#art .away { animation: away 1.6s ease-in-out infinite alternate; }
@keyframes away { from { transform: translateY(8px); } to { transform: translateY(-8px); } }
#panel { z-index: 2; }
.card {
  background: var(--paper); color: var(--ink);
  border-radius: 28px; padding: 22px 24px 24px; max-width: 320px; width: 100%;
  text-align: center; box-shadow: 0 10px 0 rgba(23, 50, 74, .15);
  display: flex; flex-direction: column; gap: 14px; align-items: center;
}
.card h1 { margin: 0; font-size: 2.5rem; line-height: 1; font-weight: 800; text-wrap: balance; }
.card p { margin: 0; font-size: 1.125rem; font-weight: 600; line-height: 1.3; }
#trailTitle { font-size: 2.75rem; font-weight: 800; line-height: 1; }
#dots { display: flex; gap: 8px; justify-content: center; }
.dot { width: 18px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); opacity: .28; }
.dot.done { background: var(--leaf); border-color: var(--leaf); opacity: 1; }
.dot.now { background: var(--pop); border-color: var(--pop); opacity: 1; animation: hop .6s ease-out; }
@keyframes hop { 0% { transform: translateY(14px) scale(.4); } 60% { transform: translateY(-8px) scale(1.25); } 100% { transform: none; } }
#hab, #habWin { line-height: 0; }
#hab .new { animation: panel 1.1s ease-out .5s both; }
@keyframes panel { from { fill: #e9e2d3; } 45% { fill: #ffffff; } }
#habWin svg { animation: lift 2.2s ease-in-out infinite alternate; }
@keyframes lift { from { transform: translateY(8px); } to { transform: translateY(-12px); } }
#trailCount { font-size: 1.125rem; font-weight: 800; font-variant-numeric: tabular-nums; }
button {
  font: inherit; font-size: 1.5rem; font-weight: 800;
  background: var(--pop); color: var(--paper);
  border: 0; border-radius: 999px; padding: 10px 36px;
  box-shadow: 0 5px 0 rgba(23, 50, 74, .25); cursor: pointer;
}
button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(23, 50, 74, .25); }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
#mute {
  position: fixed; z-index: 3; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 1.5rem; line-height: 1;
  background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 rgba(23, 50, 74, .25); opacity: .9;
}
#mute.off { opacity: .5; text-decoration: line-through; }
#reset { background: transparent; color: var(--ink); box-shadow: none; font-size: 1.125rem; padding: 4px 12px; text-decoration: underline; }
@media (prefers-reduced-motion: reduce) { .dot.now, #hearts.shake, #art .away { animation: none; } #hab .new, #habWin svg { animation: none; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="hud"><span id="score">0</span><span id="round"></span><span id="hearts"></span></div>
<div id="status"></div>

<button id="mute" type="button" aria-label="Music" aria-pressed="true">♪</button>

<div class="overlay" id="trail" hidden>
  <div class="card">
    <div id="trailTitle">Level 1</div>
    <div id="dots"></div>
    <div id="hab"></div>
    <div id="trailCount">1 of 100</div>
    <button id="next" class="icon-btn" type="button" aria-label="Next level" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" fill="currentColor"/></svg></button>
  </div>
</div>

<div class="overlay" id="panel">
  <div class="card">
    <svg id="art" viewBox="0 0 120 120" width="130" height="130" aria-hidden="true" hidden>
      <path d="M22 34V18M98 38V22M12 70V58M108 74V62" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" opacity=".3"/>
      <g class="away">
        <path d="M60 86q9 10 0 22" stroke="var(--ink)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M60 76l-6 10h12z" fill="var(--pop)"/>
        <ellipse cx="60" cy="46" rx="27" ry="33" fill="var(--pop)"/>
        <ellipse cx="50" cy="33" rx="5" ry="10" fill="var(--paper)" opacity=".35" transform="rotate(-20 50 33)"/>
      </g>
    </svg>
    <div id="habWin" hidden></div>
    <h1 id="heading">Pop the Sky</h1>
    <p id="blurb">Tap the balloons before they float away. Look inside before you pop.</p>
    <button id="go" type="button">Play</button>
    <button id="reset" type="button" hidden>Start over</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('sky'), ctx = cv.getContext('2d');
  const elScore = $('score'), elHearts = $('hearts'), elStatus = $('status'), elRound = $('round');
  const panel = $('panel'), elHeading = $('heading'), elBlurb = $('blurb'), btn = $('go'), btnReset = $('reset');
  const btnNext = $('next'), art = $('art'), btnMute = $('mute');
  const RETRY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z" fill="currentColor"/></svg>';
  const trail = $('trail'), elTrailTitle = $('trailTitle'), elDots = $('dots'), elHab = $('hab'), habWin = $('habWin'), elTrailCount = $('trailCount');

  const PAPER = ['#e4523c', '#f0a637', '#4dab69', '#8b62c4', '#ec7da4', '#f27a3a'];
  const WATER = '#27508f', SUN = '#ffcf33', INK = '#17324a';
  const SLOW = 0.4, MAX_HEARTS = 5, LEVELS = 100;
  const INTRO = { water: 7, star: 13, clock: 19, tar: 22, slime: 25 };   // level each special first appears
  // Bad balloons: popping one makes a mess over the screen for a while.
  const BAD = {
    water: { col: '#27508f', bit: '#58a6ee', mess: '#2f7fd0', dur: 3.5 },
    tar: { col: '#2a2622', bit: '#4a433d', mess: '#1d1a18', dur: 6 },
    slime: { col: '#a8dc30', bit: '#8fdc5a', mess: '#6fce3f', dur: 5 }
  };
  const TYPE_INTRO = { bundle: 4, double: 11, whizzer: 16 };   // about one new thing every third level, from level 4 to 25
  // Level shapes repeat every ten levels so the run has a rhythm: ...5 formation, ...9 rush, ...0 giant, ...1 calm.
  const shapeOf = n => n < 5 ? null : n % 10 === 5 ? 'formation' : n % 10 === 9 ? 'rush' : n % 10 === 0 ? 'giant' : n % 10 === 1 ? 'calm' : null;

  // Every level is the same generator: sky bands, one fixed orb, drifting things, ground layers,
  // props standing on the ground, and small flyers. A skin only supplies colours, shapes and count ranges.
  const SKINS = [
    { id: 'meadow', mark: 'windmill', sky: ['#74c2e4', '#97d4ea', '#bfe6ee'],
      orb: { kind: 'sun', col: '#ffd24a', col2: '#f39c2c', rays: true },
      floater: { kind: 'cloud', cols: ['#fbf6ea'], n: [2, 6] },
      ground: { style: 'hills', cols: ['#a6d68c', '#6cba61', '#3f9853'] },
      prop: { kind: 'flower', col: '#fbf6ea', col2: '#f0a637', n: [4, 9] },
      flyer: { kind: 'bird', col: '#34506b', n: [1, 5] } },
    { id: 'desert', mark: 'mesa', sky: ['#f3bd62', '#f8d184', '#fde4ad'],
      orb: { kind: 'sun', col: '#fff3c4', col2: '#ee8a2e', rays: true },
      floater: { kind: 'cloud', cols: ['#fff4dc'], n: [1, 3] },
      ground: { style: 'dunes', cols: ['#ecae58', '#dc8c3d', '#c06c2e'] },
      prop: { kind: 'cactus', col: '#3f8a55', col2: '#2f6e43', n: [2, 6] },
      flyer: { kind: 'bird', col: '#7a4a2a', n: [1, 4] } },
    { id: 'ice', mark: 'igloo', sky: ['#a9d8ee', '#cbe9f5', '#e9f6fa'],
      orb: { kind: 'sun', col: '#fffbe6', col2: '#d6eef8', rays: true },
      floater: { kind: 'cloud', cols: ['#ffffff'], n: [2, 5] },
      ground: { style: 'peaks', cols: ['#8fc4de', '#c9e6f3', '#f7fcff'] },
      prop: { kind: 'crystal', col: '#7fd0ea', col2: '#d8f4fc', n: [2, 6] },
      flyer: { kind: 'snow', col: '#ffffff', n: [18, 36] } },
    { id: 'moon', mark: 'lander', dark: true, sky: ['#0d1230', '#151c44', '#1e2757'],
      orb: { kind: 'planet', col: '#4f9be0', col2: '#69c06f' },
      floater: { kind: 'planetoid', cols: ['#8f95a8', '#b3b8c7'], n: [0, 2] },
      ground: { style: 'flat', extra: 'craters', cols: ['#7f8598', '#a9aebf', '#d0d3dd'] },
      prop: { kind: 'rock', col: '#8f95a8', col2: '#6f7588', n: [2, 7] },
      flyer: { kind: 'twinkle', col: '#ffffff', n: [30, 60] } },
    { id: 'space', mark: 'rocket', dark: true, sky: ['#130b30', '#1e1249', '#2b1b60'],
      orb: { kind: 'planet', col: '#f0a05a', col2: '#f9d9a6', ring: true },
      floater: { kind: 'planetoid', cols: ['#6f7fb0', '#8d86bd', '#5f93a8', '#a3a9c7'], n: [2, 6] },
      ground: { style: 'rocks', cols: ['#4a3f78', '#5f5296', '#7868b8'] },
      prop: { kind: 'none', n: [0, 0] },
      flyer: { kind: 'twinkle', col: '#ffffff', n: [40, 70] } },
    { id: 'volcano', mark: 'volcano', dark: true, sky: ['#3a1e2a', '#6a2a2e', '#a5432f'],
      orb: { kind: 'sun', col: '#ff9a4a', col2: '#ff9a4a', rays: false, big: 1.5 },
      floater: { kind: 'cloud', cols: ['#5a4a4f', '#6d5a5c'], n: [2, 6] },
      ground: { style: 'peaks', extra: 'volcano', cols: ['#5a3034', '#3a232c', '#1f1520'] },
      prop: { kind: 'rock', col: '#33202a', col2: '#1f1520', n: [2, 5] },
      flyer: { kind: 'ember', col: '#ffb347', n: [14, 28] } },
    { id: 'night', mark: 'cottage', dark: true, sky: ['#0a1233', '#17225a', '#27347a'],
      orb: { kind: 'moon', col: '#f6f1d0' },
      floater: { kind: 'cloud', cols: ['#3a4a8a'], n: [1, 4] },
      ground: { style: 'hills', cols: ['#22346a', '#182652', '#0f1a3c'] },
      prop: { kind: 'pine', col: '#0b1430', col2: '#0b1430', n: [3, 7] },
      flyer: { kind: 'twinkle', col: '#ffffff', n: [30, 50] } },
    { id: 'sunset', mark: 'spire', dark: true, sky: ['#4b2f7d', '#b9517f', '#f39a5c'],
      orb: { kind: 'sun', col: '#ffe08a', col2: '#ffe08a', rays: false, big: 1.7, low: true },
      floater: { kind: 'cloud', cols: ['#ffd9c2', '#f7b9a8'], n: [2, 5] },
      ground: { style: 'hills', cols: ['#5a2f6e', '#3f2257', '#2b1a45'] },
      prop: { kind: 'tower', col: '#2b1a45', col2: '#ffd76a', n: [4, 8] },
      flyer: { kind: 'bird', col: '#2b1a45', n: [2, 6] } },
    { id: 'ocean', mark: 'lighthouse', sky: ['#58c6e8', '#8ad8ee', '#c4eef5'],
      orb: { kind: 'sun', col: '#ffd24a', col2: '#f39c2c', rays: true },
      floater: { kind: 'cloud', cols: ['#fbf6ea'], n: [2, 5] },
      ground: { style: 'waves', cols: ['#3aa6d6', '#2382bd', '#16629a'] },
      prop: { kind: 'boat', col: '#c0452f', col2: '#fbf6ea', n: [1, 3] },
      flyer: { kind: 'bird', col: '#ffffff', n: [2, 6] } }
  ];

  let W = 0, H = 0, unit = 1, dpr = 1;
  let mode = 'idle';            // idle | play | over | won
  let balloons = [], bits = [], rings = [], blobs = [];
  let score = 0, scoreAtStart = 0, hearts = MAX_HEARTS, level = 0, clock = 0;
  let spawnIn = 0, spawned = 0, levelSize = 20, gap = 1, betweenUntil = 0;
  let plan = {}, pending = [], typePlan = {}, bunchLeft = 0, bunchX = 0;
  let losses = [], cardUntil = 0, doneAt = 0, cardShown = false;
  let slowUntil = 0, bigUntil = 0, splashUntil = 0, flash = 0, messKind = 'water', messStart = 0;
  let ac = null, grain = null, lv = null, runSeed = 1, skinOrder = [];

  // ---- small helpers ----
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const ri = (R, a, b) => a + Math.floor(R() * (b - a + 1));
  const rf = (R, a, b) => a + R() * (b - a);
  function mix(a, b, t) {
    const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)), x = p(a), y = p(b);
    return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
  }
  function wobble(n, amt, R = Math.random) { const a = []; for (let i = 0; i < n; i++) a.push(1 + (R() - 0.5) * amt); return a; }
  function blobPath(c, x, y, rx, ry, w) {
    for (let i = 0; i < w.length; i++) {
      const a = i / w.length * 6.283, px = x + Math.cos(a) * rx * w[i], py = y + Math.sin(a) * ry * w[i];
      if (i) c.lineTo(px, py); else c.moveTo(px, py);
    }
    c.closePath();
  }
  function shade(c, kind) {
    if (!kind) { c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0; c.shadowOffsetY = 0; return; }
    const layer = kind === 'layer';
    c.shadowColor = 'rgba(15,18,40,.34)';
    c.shadowBlur = (layer ? 12 : 7) * unit * dpr;
    c.shadowOffsetX = (layer ? 0 : 2) * unit * dpr;
    c.shadowOffsetY = (layer ? -3 : 5) * unit * dpr;
  }
  function makeGrain() {
    const g = document.createElement('canvas'); g.width = g.height = 220;
    const c = g.getContext('2d');
    for (let i = 0; i < 2600; i++) {
      c.fillStyle = i % 2 ? 'rgba(0,0,0,.07)' : 'rgba(255,255,255,.10)';
      c.fillRect(Math.random() * 220, Math.random() * 220, 1 + Math.random() * 1.5, 1 + Math.random() * 1.5);
    }
    c.strokeStyle = 'rgba(60,40,20,.07)'; c.lineWidth = 1;
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * 220, y = Math.random() * 220, a = Math.random() * 6.283, l = 6 + Math.random() * 14;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    }
    return ctx.createPattern(g, 'repeat');
  }
  // Shadows are slow to draw every frame, so each paper piece is painted once and reused.
  function sprite(w, h, paint) {
    const el = document.createElement('canvas');
    el.width = Math.ceil(w * dpr); el.height = Math.ceil(h * dpr);
    const c = el.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, w * dpr / 2, h * dpr / 2);
    paint(c);
    shade(c, null);
    if (!grain) grain = makeGrain();
    c.globalCompositeOperation = 'source-atop';
    c.fillStyle = grain; c.fillRect(-w / 2, -h / 2, w, h);
    return { img: el, w, h };
  }

  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    unit = Math.max(0.9, Math.min(1.7, Math.min(W, H) / 400));
    if (lv) { lv.bg = null; lv.floaters.forEach(f => { f.sprite = null; }); }
  }
  window.addEventListener('resize', fit);
  fit();

  function sound(freq, len) {
    if (!ac) return;
    try {
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(60, freq / 4), t + len);
      g.gain.setValueAtTime(0.25, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + len + 0.03);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + len + 0.05);
    } catch (e) {}
  }

  // Low rumbles vanish on a phone speaker, so the messes and the lost heart use noise and brighter tones.
  function blip(type, f0, f1, len, gain, delay) {
    if (!ac) return;
    try {
      const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);
      g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + len + 0.03);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + len + 0.05);
    } catch (e) {}
  }
  function hiss(kind, f0, f1, len, gain) {
    if (!ac || !noise) return;
    try {
      const t = ac.currentTime, src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noise; src.loop = true;
      fl.type = kind; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + len);
      g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
      src.connect(fl); fl.connect(g); g.connect(ac.destination); src.start(t); src.stop(t + len + 0.02);
    } catch (e) {}
  }
  function messSound(kind) {
    if (kind === 'tar') { hiss('lowpass', 1400, 300, 0.3, 0.9); blip('square', 240, 80, 0.22, 0.3); }
    else if (kind === 'slime') { blip('sawtooth', 260, 640, 0.14, 0.3); blip('sawtooth', 220, 560, 0.16, 0.3, 0.16); hiss('bandpass', 900, 500, 0.3, 0.5); }
    else { hiss('bandpass', 3000, 700, 0.35, 0.9); blip('triangle', 700, 220, 0.2, 0.3); }
  }
  function lostSound() { blip('square', 392, 370, 0.14, 0.28); blip('square', 294, 262, 0.2, 0.28, 0.15); }   // a falling "uh-oh"
  function tone(freq, len, delay) {     // a steady note, for the level-complete fanfare
    if (!ac) return;
    try {
      const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + len);

  function drawProp(c, R, p, x, y, s) {

  // One landmark per skin, standing on the far ground on the side away from the orb.

        poly('#d9dce6', [[-12, -48], [-8, -66], [8, -66], [12, -48]]);

        c.beginPath(); c.moveTo(x + 58 * k, y + 8 * k); c.lineTo(x + 58 * k, y - 44 * k); c.stroke();

        shade(c, null); dot('#1e2757', 0, -32, 6); dot('#e4523c', 18, -86, 3);
        break;
      }
      case 'rocket': {
        poly('#e4523c', [[-13, -34], [-28, 6], [-13, -4]]);
        poly('#e4523c', [[13, -34], [28, 6], [13, -4]]);

        c.moveTo(x - 14 * k, y); c.lineTo(x - 14 * k, y - 66 * k); c.quadraticCurveTo(x - 12 * k, y - 98 * k, x, y - 114 * k);
        c.quadraticCurveTo(x + 12 * k, y - 98 * k, x + 14 * k, y - 66 * k); c.lineTo(x + 14 * k, y); c.closePath(); c.fill();

  // Paint the still part of a level once: sky bands, the orb, ground layers, props, paper grain.
  function buildBg(L) {
    const el = document.createElement('canvas');
    el.width = Math.round(W * dpr); el.height = Math.round(H * dpr);
    const c = el.getContext('2d'), R = rng(L.seed), skin = L.skin, g = skin.ground;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = skin.sky[0]; c.fillRect(0, 0, W, H);
    shade(c, 'layer');
    const bands = ri(R, 1, 3);
    for (let i = 0; i < bands; i++) {
      const y = H * (0.26 + (i + rf(R, 0.1, 0.7)) * 0.42 / bands);
      fillRidge(c, ridgePts(R, y, rf(R, 9, 18) * unit, 'hills'), bands === 1 ? skin.sky[1] : mix(skin.sky[1], skin.sky[2], i / (bands - 1)));

    for (let i = 0; i < layers; i++) {
      const t = layers === 1 ? 1 : i / (layers - 1), y = H * (top + (near - top) * t);
      const col = layers === 2 ? g.cols[i * 2] : g.cols[i];
      const pts = ridgePts(R, y, rf(R, amp[0], amp[1]) * unit * (1 - t * 0.35), g.style);
      const last = i === layers - 1;

        const p = skin.prop, count = ri(R, p.n[0], p.n[1]);
        for (let k = 0; k < count; k++) {
          const x = W * (k + rf(R, 0.2, 0.8)) / count;

  }

  function drawFloaters() {
    lv.floaters.forEach(f => {
      const k = f.s * unit;
      if (!f.sprite) {
        if (lv.skin.floater.kind === 'planetoid') {
          f.sprite = sprite(60 * k + 30 * unit, 60 * k + 30 * unit, c => {
            shade(c, 'float');
            c.fillStyle = f.col; c.beginPath(); blobPath(c, 0, 0, 24 * k, 24 * k, f.w[0]); c.fill();
            shade(c, null);
            c.fillStyle = 'rgba(0,0,0,.18)';
            for (let i = 0; i < 3; i++) { c.beginPath(); c.arc((f.dents[i * 2] - 0.5) * 28 * k, (f.dents[i * 2 + 1] - 0.5) * 28 * k, (3 + f.dents[i] * 4) * k, 0, 6.283); c.fill(); }
          });
        } else {
          f.sprite = sprite(140 * k + 30 * unit, 66 * k + 30 * unit, c => {
            shade(c, 'float');
            c.fillStyle = f.col; c.beginPath();
            blobPath(c, -2 * k, 0, 36 * k, 26 * k, f.w[0]);

  function drawFlyers() {
    const fl = lv.skin.flyer;
    ctx.fillStyle = fl.col; ctx.strokeStyle = fl.col; ctx.lineCap = 'round';
    lv.flyers.forEach(f => {
      const s = f.s * unit;
      if (fl.kind === 'bird') {
        const flap = Math.sin(clock * 7 + f.p) * 5 * s, y = f.y + Math.sin(clock * 0.8 + f.p) * 8;
        ctx.lineWidth = 2.2 * s;

  }
  function moveScenery(g) {
    lv.floaters.forEach(f => {
      f.x += f.v * g * (lv.move === 'wind' ? 5 : 1);
      const m = 90 * f.s * unit;
      if (f.x > W + m) f.x = -m; else if (f.x < -m) f.x = W + m;
    });
    const kind = lv.skin.flyer.kind;
    lv.flyers.forEach(f => {
      if (kind === 'bird') { f.x += f.v * 38 * g; if (f.x > W + 20) f.x = -20; else if (f.x < -20) f.x = W + 20; }
      else if (kind === 'rain') { f.y += Math.abs(f.v) * 620 * g; f.x -= Math.abs(f.v) * 170 * g; if (f.y > H + 5) { f.y = -15; f.x = Math.random() * (W + 80); } }
      else if (kind === 'snow') { f.y += Math.abs(f.v) * 45 * g; if (f.y > H + 5) f.y = -5; }
      else if (kind === 'ember') { f.y -= Math.abs(f.v) * 55 * g; if (f.y < -5) f.y = H + 5; }
    });
  }

  // ---- balloons ----
  function canSpecial() {
    if (!pending.length || balloons.some(b => b.kind !== 'plain') || clock < splashUntil) return false;
    return !!BAD[pending[0]] || (clock >= slowUntil && clock >= bigUntil);
  }
  function spawn(form) {

      // Specials come from the level's plan, one at a time, never while a power-up is running.
      if (plan[spawned]) pending.push(plan[spawned]);
      if (canSpecial()) kind = pending.shift();
    }
    const pick = () => PAPER[Math.floor(Math.random() * PAPER.length)];
    let type = null;
    if (kind === 'plain') {
      const roll = Math.random();
      let acc = 0;
      // In the level that introduces a type, exactly two of it appear, at planned moments.
      if (playing && typePlan[spawned]) type = typePlan[spawned];
      else for (const t of ['bundle', 'double', 'whizzer']) {

    if (form) type = null;
    const calm = playing && lv.shape === 'calm';

    // Bundles grow with the levels: two balloons at first, up to three from level 12, up to four from level 24.
    const pack = type === 'bundle' ? 2 + Math.floor(Math.random() * (!playing ? 3 : level < 12 ? 1 : level < 24 ? 2 : 3)) : 0;

    const r = size * unit * (calm ? 1.2 : 1);

    const move = playing ? lv.move : 'rise';
    const b = {
      kind, type, r, vx: 0, pulse: false, w: wobble(14, 0.08),

      sway: 10 + Math.random() * 22, t: Math.random() * 6,

    if (type === 'double') { do { b.color2 = pick(); } while (b.color2 === b.color); }

  const speedAt = n => 1 + 1.5 * (1 - Math.exp(-(n - 1) / 20));

  // Launch whatever comes next in this level and return the wait until the one after.
  function spawnNext() {
    if (lv.shape === 'giant') { spawnGiant(); spawned = levelSize; return 1; }
    if (lv.shape === 'formation') {
      const kind = ['row', 'vee', 'stair', 'column'][Math.floor(Math.random() * 4)];
      const n = Math.min(levelSize - spawned, kind === 'vee' ? 5 : kind === 'column' ? 3 : 4);
      const sp = Math.min(70 * unit, (W - 90 * unit) / 4), v = (H / 7.5) * speedAt(level), mid = (n - 1) / 2;
      const room = Math.max(0, W - 90 * unit - (kind === 'column' ? 0 : (n - 1) * sp));
      const cx = W / 2 + (Math.random() - 0.5) * room, flip = Math.random() < 0.5 ? -1 : 1;
      let deep = 0;
      for (let i = 0; i < n; i++) {

  // The giant: one huge balloon that inflates with every tap until it bursts into a shower of small ones.
  function spawnGiant() {

      x: W / 2, y: H + r1 * 0.9, v: (H + r1 * 2.5) / 13, sway: 26, t: 0,
      color: PAPER[Math.floor(Math.random() * PAPER.length)], pattern: 'spots', shape: 'round' });
  }

  function burst(b) {
    const c = b.kind === 'plain' ? b.color : (BAD[b.kind] ? BAD[b.kind].bit : SUN);
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * 6.283, s = (80 + Math.random() * 220) * unit;

  function popBalloon(b, fromStar) {

      blobs = [];

        for (let x = 0; x < W + 40 * unit; x += (30 + Math.random() * 34) * unit) blobs.push({ x, r: (13 + Math.random() * 15) * unit, max: H * (0.25 + Math.random() * 0.6), sp: H * (0.3 + Math.random() * 0.4) });

  // Balloon types react to a tap in their own way before they finally pop.

      burst(b); burst(b); burst(b); flash = 0.25; score += 10; messSound('water');

        const a = i / 12 * 6.283 + Math.random() * 0.3;

          x: b.x, y: b.y, v: H / 6.5, sway: 10 + Math.random() * 20, t: Math.random() * 6, color: PAPER[i % PAPER.length],
          pattern: i % 3 === 0 ? 'stripes' : i % 3 === 1 ? 'spots' : null, shape: 'classic',

          x: b.x + dx * b.r, y: b.y + dy * b.r, v: b.v * 1.25,

  // ---- level flow ----
  function saved() { try { return Math.max(1, Math.min(LEVELS, parseInt(localStorage.getItem('pop-level'), 10) || 1)); } catch (e) { return 1; } }

  function showTrail(n, wait) {

  function begin(n, quick) {

    balloons = []; bits = []; rings = []; blobs = []; losses = [];
    slowUntil = bigUntil = splashUntil = 0;
    spawned = 0; spawnIn = 0; bunchLeft = 0;
    levelSize = Math.min(36, 20 + Math.floor(n / 3));

    betweenUntil = clock + (quick ? 0.8 : 2.4);       // after the "next" button the level starts almost at once
    cardUntil = quick ? 0 : betweenUntil; cardShown = false;
    hearts = MAX_HEARTS; scoreAtStart = score;       // every level starts fresh
    plan = {}; pending = [];

    if (unlocked.length) {

        if (BAD[k] && picks.some(p => BAD[p]) && unlocked.some(u => !BAD[u])) continue;   // one bad balloon a level
        picks.push(k);
      }
      picks.sort(() => Math.random() - 0.5);
      picks.forEach((k, i) => {
        const slot = Math.round(levelSize * (i + 1) / (count + 1)) + Math.floor(Math.random() * 5) - 2;
        plan[Math.max(1, Math.min(levelSize - 2, slot))] = k;

    typePlan = {};
    ['bundle', 'double', 'whizzer'].forEach(t => {

    });

    mode = 'play';
    panel.hidden = true;
    if (!quick) showTrail(n, false);

  }

  function audio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        musicGain = ac.createGain(); musicGain.gain.value = musicMuted ? 0 : 0.5; musicGain.connect(ac.destination);
        fadeGain = ac.createGain(); fadeGain.connect(musicGain);

  btn.addEventListener('click', () => {

  function showPanel(heading, blurb, label) {
    art.setAttribute('hidden', ''); habWin.hidden = true; elHeading.hidden = false; elBlurb.hidden = false;

  // The fail card is a picture, not a sentence: a balloon floating away and a retry arrow.

  function confetti() {

      bits.push({ x: W * (0.15 + Math.random() * 0.7), y: H * (0.45 + Math.random() * 0.25), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.1 + Math.random() * 0.8,
        c: PAPER[i % PAPER.length], r: (4 + Math.random() * 5) * unit, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 14 });
    }
    [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.5 : 0.16, i * 0.12));
  }
  // Passing a level: celebrate, then show the progress card and wait for the arrow.
  function complete() {

  }
  btnNext.addEventListener('click', () => { if (mode !== 'done') return; audio(); begin(level + 1, true); });
  function win() {
    mode = 'won'; showPanel('You popped the sky!', 'All ' + LEVELS + ' levels, ' + score + ' points.', 'Play again');
    habWin.innerHTML = balloonSvg('b', 10, -1); habWin.hidden = false;      // the finished balloon floats on the last card
  }

  function set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; }
  function hud() {
    set(elScore, score);
    set(elHearts, mode === 'idle' ? '' : '♥'.repeat(Math.max(0, hearts)) + '♡'.repeat(MAX_HEARTS - Math.max(0, hearts)));
    const on = [];
    if (clock < slowUntil) on.push('Slow time');
    if (clock < bigUntil) on.push('Big taps');
    set(elStatus, on.join('  +  '));
    set(elRound, mode === 'idle' ? '' : 'Level ' + level);
    const show = (mode === 'play' && clock < cardUntil) || (mode === 'done' && cardShown);
    if (trail.hidden === show) trail.hidden = !show;
  }

  function update(dt) {
    clock += dt;
    const g = dt * (clock < slowUntil ? SLOW : 1);

    if (mode === 'idle') {
      spawnIn -= g;
      if (spawnIn <= 0) { spawn(); spawnIn = 0.9; }
    } else if (mode === 'play' && clock >= betweenUntil) {
      if (spawned < levelSize) {
        spawnIn -= g;
        if (spawnIn <= 0) spawnIn = spawnNext();
      } else if (pending.length) {              // a planned special is still waiting: hold the level open for it
        spawnIn -= g;
        if (spawnIn <= 0 && canSpecial()) { spawn(); spawnIn = gap; }
      } else if (balloons.length === 0) {

      }
    }

    if (mode === 'done' && !cardShown && clock >= doneAt + 1.3) { cardShown = true; showTrail(level + 1, true); btnNext.focus(); }
    for (let i = losses.length - 1; i >= 0; i--) { losses[i].life -= dt; if (losses[i].life <= 0) losses.splice(i, 1); }

    for (let i = balloons.length - 1; i >= 0; i--) {

        if (b.x > W - b.r) { b.x = W - b.r; b.dir = Math.PI - b.dir; }
        if (b.y < top) { b.y = top; b.dir = -b.dir; }
        if (b.y > low) { b.y = low; b.dir = -b.dir; }
        if (Math.random() < 0.5) bits.push({ x: b.x - Math.cos(b.dir) * b.r, y: b.y - Math.sin(b.dir) * b.r, vx: -Math.cos(b.dir) * 60, vy: -Math.sin(b.dir) * 60, life: 0.3, c: '#ffffff', r: 3 * unit, rot: 0, spin: 0 });

      b.x += (Math.cos(b.t * 1.3) * b.sway + b.vx) * g;
      if (!b.vx) b.x = Math.max(b.r * 0.8, Math.min(W - b.r * 0.8, b.x));
      if (b.y < -b.r * 2.4 || (b.vx > 0 && b.x > W + b.r * 1.3) || (b.vx < 0 && b.x < -b.r * 1.3)) {
        balloons.splice(i, 1);
        if (mode === 'play' && b.kind === 'plain' && !b.free) {
          const n = b.type === 'giant' ? hearts : b.type === 'bundle' ? b.colors.length : 1;   // a giant that gets away fails the level
          hearts -= n; lostSound();
          // show the loss where the balloon left, and shake the hearts
          const side = b.y >= -b.r * 2.4;
          losses.push({ n, life: 1.2,
            x: side ? (b.vx > 0 ? W - 34 * unit : 34 * unit) : Math.max(30 * unit * n, Math.min(W - 30 * unit * n, b.x)),
            y: side ? Math.max(100 * unit, Math.min(H - 50 * unit, b.y)) : 84 * unit });

          if (hearts <= 0) fail();
        }
      }
    }
    for (let i = bits.length - 1; i >= 0; i--) {
      const p = bits[i];
      p.life -= dt; p.vy += 700 * unit * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) bits.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) { rings[i].life -= dt; if (rings[i].life <= 0) rings.splice(i, 1); }
    moveScenery(g);
    if (messKind !== 'slime') blobs.forEach(b => { b.y += (messKind === 'tar' ? 5 : 14) * dt; });

  }

  // ---- balloon drawing ----
  function icon(c, kind, s) {
    c.lineCap = 'round'; c.lineJoin = 'round';

        const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * 0.45 : s;

      c.beginPath(); c.arc(0, 0, s * 0.9, 0, 6.283); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(0, -s * 0.55); c.lineTo(0, 0); c.lineTo(s * 0.4, s * 0.15); c.stroke();
    } else if (kind === 'big') {
      c.strokeStyle = '#e4523c'; c.fillStyle = '#e4523c'; c.lineWidth = 3;
      c.beginPath(); c.arc(0, 0, s * 0.95, 0, 6.283); c.stroke();
      c.beginPath(); c.arc(0, 0, s * 0.6, 0, 6.283); c.stroke();
      c.beginPath(); c.arc(0, 0, s * 0.25, 0, 6.283); c.fill();
    } else if (kind === 'tar') {
      c.fillStyle = '#8a7f76'; c.strokeStyle = '#8a7f76'; c.lineWidth = s * 0.3;
      c.beginPath();
      for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283, r = i % 2 ? s * 0.45 : s * (0.75 + (i % 4) * 0.08); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      c.closePath(); c.fill(); c.stroke();
    } else if (kind === 'slime') {
      c.fillStyle = '#3f7d1f';
      c.fillRect(-s, -s * 0.9, s * 2, s * 0.55);
      [[-0.68, 0.7], [0, 1.25], [0.68, 0.35]].forEach(([dx, len]) => {
        c.fillRect((dx - 0.26) * s, -s * 0.5, s * 0.52, len * s);
        c.beginPath(); c.arc(dx * s, (len - 0.5) * s, s * 0.26, 0, 6.283); c.fill();
      });
    } else if (kind === 'water') {
      c.fillStyle = '#8fd0ff';
      c.beginPath(); c.moveTo(0, -s);
      c.bezierCurveTo(s * 0.9, 0, s * 0.8, s * 0.9, 0, s * 0.9);
      c.bezierCurveTo(-s * 0.8, s * 0.9, -s * 0.9, 0, 0, -s);
      c.fill();
    }
  }
  function bodyPath(c, r, w, shape) {
    if (shape === 'heart') {
      c.moveTo(0, r * 1.02);
      c.bezierCurveTo(-r * 1.5, -r * 0.05, -r * 0.8, -r * 1.3, 0, -r * 0.55);
      c.bezierCurveTo(r * 0.8, -r * 1.3, r * 1.5, -r * 0.05, 0, r * 1.02);
      c.closePath(); return;
    }
    blobPath(c, 0, 0, r * (shape === 'long' ? 0.5 : shape === 'round' ? 0.96 : 0.86), r * (shape === 'long' ? 1.25 : shape === 'round' ? 0.98 : 1.08), w);
  }
  function pattern(c, r, kind) {   // caller has clipped to the balloon body
    c.fillStyle = 'rgba(255,255,255,.36)';
    if (kind === 'stripes') {
      for (let i = -4; i <= 4; i++) {
        const y = i * r * 0.5;
        c.beginPath(); c.moveTo(-r * 1.6, y + r * 0.5); c.lineTo(r * 1.6, y - r * 0.5); c.lineTo(r * 1.6, y - r * 0.28); c.lineTo(-r * 1.6, y + r * 0.72); c.closePath(); c.fill();
      }
    } else {
      for (let row = -3; row <= 3; row++) for (let col = -3; col <= 3; col++) {
        c.beginPath(); c.arc((col + (row % 2 ? 0.5 : 0)) * r * 0.46, row * r * 0.42, r * 0.12, 0, 6.283); c.fill();
      }
    }
  }
  // One cut-paper balloon body at the origin.
  function one(c, r, color, w, o) {
    const shape = o.shape || 'classic', kind = o.kind || 'plain';
    const see = kind !== 'plain' && !BAD[kind];
    const ky = r * (shape === 'long' ? 1.2 : shape === 'heart' ? 0.95 : shape === 'round' ? 0.92 : 1.02);
    shade(c, 'float');
    c.fillStyle = color; c.beginPath();
    if (o.open) { c.moveTo(-r * 0.09, ky - r * 0.08); c.lineTo(-r * 0.22, ky + r * 0.22); c.lineTo(r * 0.22, ky + r * 0.22); c.lineTo(r * 0.09, ky - r * 0.08); }
    else { c.moveTo(0, ky - r * 0.06); c.lineTo(-r * 0.16, ky + r * 0.24); c.lineTo(r * 0.16, ky + r * 0.24); }
    c.closePath(); c.fill();
    c.fillStyle = see ? '#fdf6e3' : color;
    c.beginPath(); bodyPath(c, r, w, shape); c.fill();
    shade(c, null);
    if (!see) {      // a cream paper rim keeps every balloon readable against any sky
      c.strokeStyle = '#fffaf0'; c.lineWidth = 2.5 * unit; c.lineJoin = 'round';
      c.beginPath(); bodyPath(c, r, w, shape); c.stroke();
    }
    if (see) {
      c.strokeStyle = color; c.lineWidth = 3.5; c.setLineDash([9, 6]);
      c.beginPath(); c.save(); c.scale(0.86, 0.88); bodyPath(c, r, w, shape); c.restore(); c.stroke();
      c.setLineDash([]);
    } else {
      if (o.pattern) { c.save(); c.beginPath(); bodyPath(c, r, w, shape); c.clip(); pattern(c, r, o.pattern); c.restore(); }
      c.fillStyle = 'rgba(255,255,255,.26)';
      c.beginPath(); c.ellipse(-r * (shape === 'long' ? 0.18 : shape === 'heart' ? 0.48 : 0.32), -r * 0.46, r * 0.19, r * 0.34, -0.5, 0, 6.283); c.fill();
    }
    if (kind !== 'plain') icon(c, kind, r * 0.47);
  }
  // The whole balloon for its type: a bundle of three, a balloon inside a balloon, an untied whizzer, or a single.
  function paintBalloon(c, b) {
    const r = b.r;
    if (b.type === 'bundle') {
      const subs = bundleLayout(b.colors.length);
      c.strokeStyle = b.thread; c.lineWidth = 1.5;
      c.beginPath();
      subs.forEach(([dx, dy, k]) => { c.moveTo(dx * r, dy * r + r * k * 1.2); c.lineTo(0, r * 1.3); });
      c.lineTo(0, r * 1.9); c.stroke();
      subs.forEach(([dx, dy, k], i) => { c.save(); c.translate(dx * r, dy * r); one(c, r * k, b.colors[i], b.ws[i], {}); c.restore(); });
    } else if (b.type === 'double') {
      one(c, r, b.color, b.w, {});
      one(c, r * 0.6, b.color2, b.w, {});
    } else if (b.type === 'whizzer') {
      one(c, r, b.color, b.w, { shape: 'long', open: true, pattern: 'stripes' });
    } else {
      one(c, r, b.color, b.w, { kind: b.kind, shape: b.shape, pattern: b.pattern });
    }
  }
  function drawBalloon(b) {
    const r = b.r, thread = lv.skin.dark ? 'rgba(255,255,255,.6)' : '#5b4a3a';
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.rotate(b.zip > 0 ? b.dir + Math.PI / 2 : Math.sin(b.t * 1.3) * 0.09);
    if (b.squash > 0) ctx.scale(1 + b.squash * 0.6, 1 + b.squash * 0.6);
    if (b.type !== 'bundle' && b.type !== 'whizzer') {
      ctx.strokeStyle = thread; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, r * 1.15); ctx.quadraticCurveTo(Math.sin(b.t * 3) * 8, r * 1.7, 0, r * 2.3); ctx.stroke();
    }
    if (!b.sprite) { b.thread = thread; b.sprite = sprite(r * 2.4 + 32 * unit, r * 4 + 34 * unit, c => paintBalloon(c, b)); }
    ctx.drawImage(b.sprite.img, -b.sprite.w / 2, -b.sprite.h / 2, b.sprite.w, b.sprite.h);
    ctx.restore();
  }

  function draw() {
    if (!lv.bg) lv.bg = buildBg(lv);
    ctx.drawImage(lv.bg, 0, 0, W, H);
    drawFlyers();
    drawFloaters();
    balloons.forEach(drawBalloon);

    losses.forEach(l => {
      ctx.globalAlpha = Math.min(1, l.life * 2);
      for (let k = 0; k < l.n; k++) {
        const s = 20 * unit, x = l.x + (k - (l.n - 1) / 2) * 46 * unit, y = l.y + (1.2 - l.life) * 26 * unit;
        ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
        ctx.bezierCurveTo(x - s * 1.5, y - s * 0.1, x - s * 0.8, y - s * 1.2, x, y - s * 0.45);
        ctx.bezierCurveTo(x + s * 0.8, y - s * 1.2, x + s * 1.5, y - s * 0.1, x, y + s * 0.9);
        ctx.closePath();
        ctx.fillStyle = '#e4523c'; ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
        ctx.stroke(); ctx.fill();
        ctx.lineWidth = 2.5; ctx.beginPath();
        ctx.moveTo(x, y - s * 0.45); ctx.lineTo(x - s * 0.22, y); ctx.lineTo(x + s * 0.18, y + s * 0.3); ctx.lineTo(x, y + s * 0.9); ctx.stroke();
      }
    });
    bits.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.spin * (0.5 - p.life));
      ctx.fillRect(-p.r * 1.3, -p.r * 0.7, p.r * 2.6, p.r * 1.4); ctx.restore();
    });
    ctx.globalAlpha = 1;

    rings.forEach(k => {
      const f = 1 - k.life / 0.3;
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - f) + ')'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(k.x, k.y, k.max * (0.3 + 0.7 * f), 0, 6.283); ctx.stroke();
    });

    if (clock < slowUntil) { ctx.fillStyle = 'rgba(130,90,220,.14)'; ctx.fillRect(0, 0, W, H); }
    if (clock < splashUntil) {
      const fade = Math.min(1, (splashUntil - clock) / 0.8);
      ctx.fillStyle = BAD[messKind].mess;
      if (messKind === 'slime') {
        const t = clock - messStart;
        ctx.globalAlpha = fade * 0.88;
        ctx.fillRect(0, 0, W, 20 * unit);
        blobs.forEach(b => {
          const len = Math.min(b.max, b.sp * t);
          ctx.fillRect(b.x - b.r, 0, b.r * 2, len);
          ctx.beginPath(); ctx.arc(b.x, len, b.r, 0, 6.283); ctx.fill();
        });
      } else if (messKind === 'tar') {
        ctx.globalAlpha = fade * 0.97;
        blobs.forEach(b => {
          ctx.beginPath(); blobPath(ctx, b.x, b.y, b.r, b.r * 0.9, b.w); ctx.fill();
          ctx.beginPath(); ctx.arc(b.x + b.r * 1.15 * b.w[0], b.y - b.r * 0.5, b.r * 0.16, 0, 6.283); ctx.fill();
          ctx.beginPath(); ctx.arc(b.x - b.r * 1.1 * b.w[1], b.y + b.r * 0.7, b.r * 0.12, 0, 6.283); ctx.fill();
        });
      } else {
        ctx.globalAlpha = fade * 0.8;
        blobs.forEach(b => {
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
          ctx.beginPath(); ctx.ellipse(b.x + b.r * 0.3, b.y + b.r * 1.1, b.r * 0.22, b.r * 0.6, 0, 0, 6.283); ctx.fill();
        });
      }
      ctx.globalAlpha = 1;
    }
    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.7, flash * 2.5) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // ---- boot: a random scene with balloons drifting behind the start card ----
  newRun();
  lv = makeLevel(0);
  document.body.classList.toggle('night', !!lv.skin.dark);
  const resume = saved();
  if (resume > 1) { btn.textContent = 'Continue level ' + resume; btnReset.hidden = false; }
  for (let i = 0; i < 6; i++) { spawn(); balloons[i].y = H * (0.25 + Math.random() * 0.7); }
  window.popDebug = (n, skinId, mood, move) => {
    force = { n, mood: mood || null, move: move || null };                    // jump to a level (and skin) while testing
    audio(); newRun();
    const k = SKINS.findIndex(s => s.id === skinId);
    if (k >= 0) skinOrder[n] = k;
    score = 0; begin(n);
  };
  window.popDebug.tunes = () => TUNES.map(T => { const b = buildTune(T); return T.name + ': ' + b.pulses + ' pulses, pickup ' + T.pickup + ', ' + T.chords.split(' ').length + ' bars, ' + b.len.toFixed(1) + 's'; });
  window.popDebug.win = () => win();
  window.popDebug.info = n => ({ speed: speedAt(n), gap: 0.38 + 0.47 * Math.exp(-(n - 1) / 16), size: Math.min(36, 20 + Math.floor(n / 3)) });
  window.popDebug.halt = () => { fadeSong(0.3); mode = 'idle'; balloons = []; losses = []; panel.hidden = true; };
  window.popDebug.queue = k => { pending.unshift(k); };
  window.popDebug.mess = k => { const b = { kind: k, x: W / 2, y: H / 2, r: 40 * unit, color: BAD[k].col }; balloons.push(b); popBalloon(b, false); };

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw(); hud(); musicTick();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
